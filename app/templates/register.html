{% extends "base.html" %}

{% block title %}Register — OSINT 100X{% endblock %}

{% block extra_css %}
<style>
.auth-container{display:flex;align-items:center;justify-content:center;min-height:70vh}
.auth-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:44px 36px;max-width:400px;width:100%;backdrop-filter:blur(20px)}
.auth-card h1{font-size:28px;font-weight:900;text-align:center;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-card .sub{text-align:center;color:rgba(255,255,255,0.25);margin:6px 0 28px;font-size:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:4px;font-weight:500}
.form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;color:#fff;font-size:15px;outline:none;transition:border .2s}
.form-group input:focus{border-color:rgba(124,58,237,0.3)}
.btn-auth{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.2)}
.link{text-align:center;margin-top:14px;color:rgba(255,255,255,0.2);font-size:14px}
.link a{color:#a78bfa;text-decoration:none}
.password-hint{font-size:11px;color:rgba(255,255,255,0.15);margin-top:4px}
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🔍 OSINT 100X</h1>
        <p class="sub">Create your account</p>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="John Doe" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 8 characters" required minlength="8" />
                <div class="password-hint">Must be at least 8 characters with letters and numbers</div>
            </div>
            <button type="submit" class="btn-auth">Register</button>
        </form>
        <div class="link">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></div>
    </div>
</div>
{% endblock %}
